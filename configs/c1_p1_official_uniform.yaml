# ==============================================================================
# Experiment C1 (Configuration P1) — Official Uniform Initialization (official_uniform)
#
# Research Question (C1):
#   Isolate the effect of Smooth Projection initialization and scaling while
#   holding all other factors (vit_base_patch16_224.augreg_in1k, bicubic 224x224,
#   Normalize(0.5, 0.5), seed=42, batch_size=10, gamma=1.0, float64 RLS) fixed.
#
# Projection Specification (P1):
#   - Identifier: official_uniform
#   - Distribution: P_{ij} ~ U(-1 / sqrt(d), +1 / sqrt(d)), where d = 768
#   - Matches PyTorch nn.Linear(768, 1000, bias=False) default kaiming_uniform_(a=sqrt(5))
#   - Bound: +/- 1 / sqrt(768) ≈ +/- 0.03608439
#   - Population variance: 1 / (3 * 768) = 1 / 2304 ≈ 0.00043403
#   - Population std: 1 / sqrt(3 * 768) = 1 / 48 ≈ 0.02083333
# ==============================================================================

seed: 42
class_order_seed: 42
projection_seed: 42
stream_seed: 42

dataset:
  name: uoft-cs/cifar100
  num_classes: 100
  classes_per_task: 10
  class_order: null
  image_size: 224
  mean: [0.5, 0.5, 0.5]
  std: [0.5, 0.5, 0.5]
  interpolation: bicubic

projection:
  dimension: 1000
  initialization: official_uniform
  seed: 42

model:
  backbone: vit_base_patch16_224.augreg_in1k
  pretrained: true
  feature_fusion: true
  smooth_projection: true
  projection_dim: 1000
  projection_init: official_uniform
  gamma: 1.0
  rls_dtype: float64

training:
  batch_size: 10
  num_workers: 0
  device: auto

logging:
  use_wandb: false
  project: hcmus-foal-reproduction
  entity: null
  results_dir: results
