# Initial pilot configuration; not automatically an exact replication of paper.
seed: 42
dataset:
  name: uoft-cs/cifar100
  num_classes: 100
  classes_per_task: 10
  class_order: null    # generated reproducibly with the seed; log actual order
  image_size: 224
model:
  backbone: vit_base_patch16_224.augreg_in1k
  pretrained: true
  feature_fusion: true
  smooth_projection: true
  projection_dim: 1000
  gamma: 1.0
  rls_dtype: float64
training:
  batch_size: 10
  num_workers: 0
  device: auto
logging:
  use_wandb: false
  project: hcmus-foal-reproduction
  entity: null
  results_dir: results
