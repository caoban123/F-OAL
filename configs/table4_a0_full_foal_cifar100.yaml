# ==============================================================================
# Table 4 Ablation Study: Condition A0 (Full F-OAL on CIFAR-100)
#
# Reference Paper: NeurIPS 2024 Table 4
# Reported Value: \bar{A} = 91.1%
#
# Architectural Configuration:
#   - Feature Fusion (FF): ENABLED (true)
#   - Smooth Projection (SP): ENABLED (true), D=1000, official_uniform
#
# Preprocessing & Backbone:
#   - Backbone: vit_base_patch16_224.augreg2_in21k_ft_in1k (ImageNet-21K + 1K FT)
#   - Interpolation: bilinear
#   - Normalization: false (Raw [0, 1] tensor)
#   - Optimization: Online Ridge RLS, batch_size=10, gamma=1.0, float64
#
# Equivalence Note:
#   This configuration is mathematically and empirically identical to C3-D.
# ==============================================================================

seed: 42
class_order_seed: 42
projection_seed: 42
stream_seed: 42

dataset:
  name: uoft-cs/cifar100
  num_classes: 100
  classes_per_task: 10
  class_order: null
  image_size: 224
  mean: null
  std: null
  interpolation: bilinear
  normalize: false

projection:
  dimension: 1000
  initialization: official_uniform
  seed: 42

model:
  backbone: vit_base_patch16_224.augreg2_in21k_ft_in1k
  pretrained: true
  feature_fusion: true
  smooth_projection: true
  projection_dim: 1000
  projection_init: official_uniform
  gamma: 1.0
  rls_dtype: float64

training:
  batch_size: 10
  num_workers: 2
  device: auto

logging:
  use_wandb: true
  project: hcmus-foal-reproduction
  entity: caoban170106-tr-ng-i-h-c-khoa-h-c-t-nhi-n-hqg-hcm
  base_url: https://api.forge.coreweave.com
  group: table4_ablation
  results_dir: results
