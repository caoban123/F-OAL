# ==============================================================================
# Table 4 Ablation Study: Condition A3 (F-OAL w/o Both FF & SP on CIFAR-100)
#
# Reference Paper: NeurIPS 2024 Table 4
# Reported Value: \bar{A} = 90.6% (-0.5 pp from Full F-OAL)
#
# Architectural Configuration:
#   - Feature Fusion (FF): DISABLED (false) -> Uses 12th transformer block CLS token
#   - Smooth Projection (SP): DISABLED (false) -> Feeds 768-dim features directly to RLS
#
# Preprocessing & Backbone:
#   - Backbone: vit_base_patch16_224.augreg2_in21k_ft_in1k (ImageNet-21K + 1K FT)
#   - Interpolation: bilinear
#   - Normalization: false (Raw [0, 1] tensor)
#   - Optimization: Online Ridge RLS, batch_size=10, gamma=1.0, float64
# ==============================================================================

seed: 42
class_order_seed: 42
projection_seed: 42
stream_seed: 42

dataset:
  name: uoft-cs/cifar100
  num_classes: 100
  classes_per_task: 10
  class_order: null
  image_size: 224
  mean: null
  std: null
  interpolation: bilinear
  normalize: false

projection:
  dimension: 768
  initialization: null
  seed: 42

model:
  backbone: vit_base_patch16_224.augreg2_in21k_ft_in1k
  pretrained: true
  feature_fusion: false
  smooth_projection: false
  projection_dim: 768
  projection_init: null
  gamma: 1.0
  rls_dtype: float64

training:
  batch_size: 10
  num_workers: 2
  device: auto

logging:
  use_wandb: true
  project: hcmus-foal-reproduction
  entity: caoban170106-tr-ng-i-h-c-khoa-h-c-t-nhi-n-hqg-hcm
  base_url: https://api.forge.coreweave.com
  group: table4_ablation
  results_dir: results
