# ==============================================================================
# Experiment C1 (Configuration P0) — Current Gaussian Baseline (gaussian_std1)
#
# Research Question (C1):
#   Isolate the effect of Smooth Projection initialization and scaling while
#   holding all other factors (vit_base_patch16_224.augreg_in1k, bicubic 224x224,
#   Normalize(0.5, 0.5), seed=42, batch_size=10, gamma=1.0, float64 RLS) fixed.
#
# Projection Specification (P0):
#   - Identifier: gaussian_std1
#   - Distribution: P_{ij} ~ N(0, 1)
#   - Population variance: 1.0, population std: 1.0
# ==============================================================================

seed: 42
class_order_seed: 42
projection_seed: 42
stream_seed: 42

dataset:
  name: uoft-cs/cifar100
  num_classes: 100
  classes_per_task: 10
  class_order: null
  image_size: 224
  mean: [0.5, 0.5, 0.5]
  std: [0.5, 0.5, 0.5]
  interpolation: bicubic

projection:
  dimension: 1000
  initialization: gaussian_std1
  gaussian_std: 1.0
  seed: 42

model:
  backbone: vit_base_patch16_224.augreg_in1k
  pretrained: true
  feature_fusion: true
  smooth_projection: true
  projection_dim: 1000
  projection_init: gaussian_std1
  gaussian_std: 1.0
  gamma: 1.0
  rls_dtype: float64

training:
  batch_size: 10
  num_workers: 0
  device: auto

logging:
  use_wandb: false
  project: hcmus-foal-reproduction
  entity: null
  results_dir: results
