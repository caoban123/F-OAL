# ==============================================================================
# Experiment C3 (Configuration C3-B) — Bilinear Resizing + Normalized [-1, 1]
#
# Factorial Condition: Factor A = Bilinear, Factor B = Normalized
# Isolates the Main Effect of Spatial Interpolation (Bilinear vs Bicubic)
#
# Fixed Experimental Controls:
#   - Backbone: vit_base_patch16_224.augreg2_in21k_ft_in1k (ImageNet-21K + 1K FT)
#   - Projection: official_uniform, D=1000, seed=42 (identical matrix P)
#   - Dataset: CIFAR-100, 10 tasks x 10 classes, seed=42
#   - Optimization: Online Ridge RLS, batch_size=10, gamma=1.0, float64
# ==============================================================================

seed: 42
class_order_seed: 42
projection_seed: 42
stream_seed: 42

dataset:
  name: uoft-cs/cifar100
  num_classes: 100
  classes_per_task: 10
  class_order: null
  image_size: 224
  mean: [0.5, 0.5, 0.5]
  std: [0.5, 0.5, 0.5]
  interpolation: bilinear
  normalize: true

projection:
  dimension: 1000
  initialization: official_uniform
  seed: 42

model:
  backbone: vit_base_patch16_224.augreg2_in21k_ft_in1k
  pretrained: true
  feature_fusion: true
  smooth_projection: true
  projection_dim: 1000
  projection_init: official_uniform
  gamma: 1.0
  rls_dtype: float64

training:
  batch_size: 10
  num_workers: 2
  device: auto

logging:
  use_wandb: true
  project: hcmus-foal-reproduction
  entity: caoban170106-tr-ng-i-h-c-khoa-h-c-t-nhi-n-hqg-hcm
  base_url: https://api.forge.coreweave.com
  group: c3_preprocessing_alignment
  results_dir: results
