# ==============================================================================
# Table 4 Ablation Study: Condition A0 (Full F-OAL on DTD)
#
# Reference Paper: NeurIPS 2024 Table 4
# Reported Value: \bar{A} = 82.8%
#
# Architectural Configuration:
#   - Feature Fusion (FF): ENABLED (true)
#   - Smooth Projection (SP): ENABLED (true), D=1000, official_uniform
#
# Preprocessing & Backbone:
#   - Backbone: vit_base_patch16_224.augreg2_in21k_ft_in1k (ImageNet-21K + 1K FT)
#   - Interpolation: bilinear
#   - Normalization: false (Raw [0, 1] tensor)
#   - Optimization: Online Ridge RLS, batch_size=10, gamma=1.0, float64
# ==============================================================================

seed: 42
class_order_seed: null   # Seed for class order permutation (defaults to seed if null)
projection_seed: null    # Seed for random projection matrix (defaults to seed if null)
stream_seed: null        # Seed for batch stream shuffling & sampling (defaults to seed if null)

dataset:
  name: tanganke/dtd
  type: dtd
  total_classes: 47
  num_classes: 40
  classes_per_task: 4
  samples_per_class: 40
  class_order: null
  image_size: 224
  mean: null
  std: null
  interpolation: bilinear
  normalize: false

projection:
  dimension: 1000
  initialization: official_uniform
  seed: null             # Defaults to base_seed if null

model:
  backbone: vit_base_patch16_224.augreg2_in21k_ft_in1k
  pretrained: true
  feature_fusion: true
  smooth_projection: true
  projection_dim: 1000
  projection_init: official_uniform
  gamma: 1.0
  rls_dtype: float64

training:
  batch_size: 10
  num_workers: 2
  device: auto

logging:
  use_wandb: true
  project: hcmus-foal-reproduction
  entity: caoban170106-tr-ng-i-h-c-khoa-h-c-t-nhi-n-hqg-hcm
  base_url: https://api.forge.coreweave.com
  group: table4_ablation_dtd
  results_dir: results
